apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: '1.27'
    kubenix/project-name: kubenix
  labels:
    app.kubernetes.io/instance: actualbudget
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual
    helm.sh/chart: actual-2.0.0
  name: actualbudget
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: actualbudget
      app.kubernetes.io/name: actual
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: actualbudget
        app.kubernetes.io/name: actual
    spec:
      containers:
        - image: ghcr.io/beluga-cloud/actual/actualserver:23.12.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          name: actual-server
          ports:
            - containerPort: 5006
              name: web
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 64087
            runAsNonRoot: true
            runAsUser: 64087
          volumeMounts:
            - mountPath: /data
              name: data
              subPath: persistent-files
            - mountPath: /data/user-files
              name: data
              subPath: user-files
            - mountPath: /data/server-files
              name: data
              subPath: server-files
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsGroup: 64087
        runAsNonRoot: true
        runAsUser: 64087
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actualbudget-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: '1.27'
    kubenix/project-name: kubenix
  labels:
    app.kubernetes.io/instance: actualbudget
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual
    helm.sh/chart: actual-2.0.0
  name: actualbudget-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test
    kubenix/k8s-version: '1.27'
    kubenix/project-name: kubenix
  labels:
    app.kubernetes.io/instance: actualbudget
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual
    helm.sh/chart: actual-2.0.0
  name: actualbudget-test-connection
spec:
  containers:
    - args:
        - --timeout=5
        - -O/dev/null
        - actualbudget:5006/health
      command:
        - wget
      image: busybox:musl
      name: wget
      resources:
        limits:
          cpu: 100m
          memory: 25Mi
        requests:
          cpu: 10m
          memory: 25Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: '1.27'
    kubenix/project-name: kubenix
  labels:
    app.kubernetes.io/instance: actualbudget
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual
    helm.sh/chart: actual-2.0.0
  name: actualbudget
spec:
  ports:
    - name: web
      nodePort: 0
      port: 5006
      targetPort: web
  selector:
    app.kubernetes.io/instance: actualbudget
    app.kubernetes.io/name: actual
  type: ClusterIP
