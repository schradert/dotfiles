apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--forgejo--forgejo-src
  namespace: dotfiles
spec:
  restic:
    copyMethod: Direct
    moverSecurityContext:
      fsGroup: 101
    pruneIntervalDays: 8
    repository: volsync--forgejo--forgejo
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: gitea-shared-storage
  trigger:
    schedule: 0 4 * * *
