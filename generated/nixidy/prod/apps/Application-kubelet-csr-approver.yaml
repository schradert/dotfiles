apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-csr-approver
  namespace: cicd
spec:
  destination:
    namespace: security
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./generated/nixidy/prod/kubelet-csr-approver
    repoURL: https://github.com/schradert/dotfiles.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - FailOnSharedResource=true
      - PruneLast=true
      - ServerSideApply=true
