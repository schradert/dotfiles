apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill
  namespace: dotfiles
spec:
  dataFrom:
    - extract:
        key: windmill.main.credentials.postgresql.acid.zalan.do
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-default
  target:
    template:
      data:
        url: postgres://windmill:{{ .password }}@main.default.svc.cluster.local:5432/windmill
