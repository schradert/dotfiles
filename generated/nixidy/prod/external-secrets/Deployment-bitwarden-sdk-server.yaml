apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: external-secrets
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bitwarden-sdk-server
  name: bitwarden-sdk-server
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
      app.kubernetes.io/name: bitwarden-sdk-server
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: external-secrets
        app.kubernetes.io/name: bitwarden-sdk-server
    spec:
      containers:
        - image: ghcr.io/external-secrets/bitwarden-sdk-server:v0.5.0
          imagePullPolicy: Never
          livenessProbe:
            httpGet:
              path: /live
              port: http
              scheme: HTTPS
          name: bitwarden-sdk-server
          ports:
            - containerPort: 9998
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTPS
          resources: {}
          securityContext: {}
          volumeMounts:
            - mountPath: /certs
              name: bitwarden-tls-certs
      securityContext: {}
      serviceAccountName: bitwarden-sdk-server
      volumes:
        - name: bitwarden-tls-certs
          secret:
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: key.pem
              - key: ca.crt
                path: ca.pem
            secretName: bitwarden-tls-certs
