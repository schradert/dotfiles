apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr
  namespace: dotfiles
spec:
  data:
    - remoteRef:
        key: lidarr
      secretKey: LIDARR__AUTH__APIKEY
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: bitwarden
    - remoteRef:
        key: lidarr.main.credentials.postgresql.acid.zalan.do
        property: password
      secretKey: LIDARR__POSTGRES__PASSWORD
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-default
