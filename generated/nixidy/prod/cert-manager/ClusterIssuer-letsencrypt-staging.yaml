apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  annotations:
    chart.canivete.app/cert-manager: ""
  name: letsencrypt-staging
spec:
  acme:
    email: t0rdos@pm.me
    privateKeySecretRef:
      name: letsencrypt-staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: credentials
              name: cert-manager
        selector:
          dnsZones:
            - trdos.me
