apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readarr
  namespace: dotfiles
spec:
  data:
    - remoteRef:
        key: readarr
      secretKey: READARR__AUTH__APIKEY
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: bitwarden
    - remoteRef:
        key: readarr.main.credentials.postgresql.acid.zalan.do
        property: password
      secretKey: READARR__POSTGRES__PASSWORD
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-default
