apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: main
  namespace: storage
spec:
  databases:
    autobrr: autobrr
    gatus: gatus
    keycloak: keycloak
    lidarr-log: lidarr
    lidarr-main: lidarr
    radarr-log: radarr
    radarr-main: radarr
    sonarr-log: sonarr
    sonarr-main: sonarr
    vaultwarden: vaultwarden
  numberOfInstances: 1
  postgresql:
    version: "16"
  teamId: acid
  users:
    autobrr: createdb
    gatus: createdb
    keycloak: createdb
    lidarr: createdb
    radarr: createdb
    sonarr: createdb
    superadmin: superuser
    vaultwarden: createdb
  volume:
    size: 10Gi
